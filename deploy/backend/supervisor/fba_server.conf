[program:fba_server]
directory=/fba/backend
command=/usr/local/bin/granian main:app --interface asgi --host 0.0.0.0 --port %(ENV_FBA_SERVER_PORT)s --metrics --metrics-address 0.0.0.0 --metrics-port 8002 --workers 1 --backlog 1024 --workers-kill-timeout 120 --backpressure 2000 --pid-file /var/run/granian.pid --log --log-level debug
user=root
autostart=true
autorestart=true
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
